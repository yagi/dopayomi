<!DOCTYPE html>
<html lang="ja" data-skin="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dopayomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 紙と活字: 紙の地に墨の明朝。カードや角丸は使わず、罫線で区切る。差し色は栞紐の臙脂だけ。
   レイアウト: 上に罫線で挟んだ表示窓、その下に操作の行、さらに下で「設定」と「書棚・区切りの確認」を2段組。 */
:root {
  --bg: #f6f4ef;
  --ink: #1e1d1a;
  --muted: #6e6a62;
  --rule: #1e1d1a;
  --rule-soft: #d8d4cb;
  --field: #edeae3;
  --accent: #8b2a2c;
  --accent-ink: #f6f4ef;
  --mark: #ebe4d8;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Old Mincho", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1a17;
    --ink: #e4dfd4;
    --muted: #9b968b;
    --rule: #e4dfd4;
    --rule-soft: #3b3933;
    --field: #24231f;
    --accent: #d9817f;
    --accent-ink: #1b1a17;
    --mark: #2d2b26;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1a17;
  --ink: #e4dfd4;
  --muted: #9b968b;
  --rule: #e4dfd4;
  --rule-soft: #3b3933;
  --field: #24231f;
  --accent: #d9817f;
  --accent-ink: #1b1a17;
  --mark: #2d2b26;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.8;
  font-feature-settings: "palt" 0;
}
main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 20px 64px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  border-bottom: 3px double var(--rule); padding-bottom: 10px;
}
h1 { font-family: var(--font-display); font-size: 30px; margin: 0; font-weight: 700; letter-spacing: .18em; line-height: 1.2; }
header p { margin: 0; color: var(--muted); font-size: 13.5px; letter-spacing: .04em; }
h2 {
  font-family: var(--font-display); font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .4em;
}

/* 表示窓: 上下の罫線と、中央を示す細い縦線だけ */
.stage {
  position: relative;
  background: var(--stage-bg, var(--bg));
  color: var(--stage-ink, var(--ink));
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
}
.stage::before, .stage::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 1px;
  height: 20px;
  background: var(--accent);
}
.stage::before { top: calc(50% - 78px); }
.stage::after { bottom: calc(50% - 78px); }
/* 再生中は表示窓だけを画面いっぱいに広げ、ほかの操作部品を覆い隠す */
body.immersive { overflow: hidden; }
body.immersive .stage {
  position: fixed;
  inset: 0;
  height: auto;
  border: 0;
  z-index: 10;
  cursor: none;
}
#chunk {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: calc(clamp(26px, 6.4vw, 58px) * var(--fs-kanji, 1));
  white-space: nowrap;
  line-height: 1.2;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 1fr;   /* 中央列＝句読点を除いた本体。前後の記号は左右の列に逃がす */
  align-items: baseline;                 /* 列ごとに文字の大きさが違っても、ベースラインで揃える */
}
#chunk .lead { text-align: right; }
#chunk .trail { text-align: left; }
#chunk .kana { font-size: calc(1em * var(--fs-kana, 1) / var(--fs-kanji, 1)); }
.stage.gothic #chunk { font-family: var(--font-gothic); }

/* 目盛り: 罫線1本の上に小さな四角のつまみ */
input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; margin: 0; height: 18px; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 15px; margin-top: -7px; background: var(--ink); border: 0; border-radius: 0; }
input[type="range"]::-moz-range-thumb { width: 9px; height: 15px; background: var(--ink); border: 0; border-radius: 0; }
#seek::-webkit-slider-thumb { background: var(--accent); }
#seek::-moz-range-thumb { background: var(--accent); }

.bar { display: flex; flex-direction: column; gap: 2px; }
.stats { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13.5px; letter-spacing: .08em; flex-wrap: wrap; }

.controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--rule-soft); padding-bottom: 14px; }
button {
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 4px 16px;
  letter-spacing: .2em;
  cursor: pointer;
}
button:hover { background: var(--mark); }
button.primary { background: var(--ink); color: var(--bg); min-width: 112px; }
button.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.controls .hint { margin: 0; }
.onplay { color: var(--muted); margin-left: 10px; letter-spacing: .1em; }
.keys { color: var(--muted); font-size: 12.5px; margin-left: auto; }
kbd { font: inherit; border: 1px solid var(--rule-soft); padding: 0 5px; }
input[type="checkbox"] { accent-color: var(--ink); }

/* 2段組: 段のあいだに縦の罫線 */
.grid { display: grid; grid-template-columns: 280px 1fr; gap: 0; align-items: start; }
.grid > .panel:first-child { padding-right: 28px; border-right: 1px solid var(--rule-soft); }
.grid > .panel + .panel { padding-left: 28px; }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; }
  .grid > .panel:first-child { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule-soft); padding-bottom: 22px; margin-bottom: 22px; }
  .grid > .panel + .panel { padding-left: 0; }
  .keys { display: none; }
}
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h2 { border-bottom: 1px solid var(--rule); padding-bottom: 4px; flex: 1; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label, .field .label { display: flex; justify-content: space-between; gap: 8px; }
.field output { color: var(--accent); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.7; }

/* 区切り方: 縦線で並べ、選んだものに臙脂の下線 */
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg label { cursor: pointer; padding: 0 12px; border-left: 1px solid var(--rule-soft); color: var(--muted); }
.seg label:first-of-type { border-left: 0; padding-left: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.field .seg label { display: block; text-align: center; }   /* .field label の横並び指定を打ち消し、選択肢の文字を中央に置く */
.seg input:checked + label { color: var(--ink); text-decoration: underline 2px var(--accent); text-underline-offset: 6px; }
.seg input:focus-visible + label { outline: 1px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; }

input[type="text"] {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule-soft);
  border-radius: 0;
  padding: 4px 0;
}
input[type="text"]:focus { border-bottom-color: var(--ink); outline: none; }
textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  font: inherit;
  line-height: 1.9;
  color: var(--ink);
  background: var(--field);
  border: 0;
  border-radius: 0;
  padding: 12px 14px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }

/* 区切りの確認: 区切りごとに細い縦線、読んでいる所は臙脂の下線 */
#preview {
  max-height: 260px;
  overflow-y: auto;
  border-bottom: 1px solid var(--rule-soft);
  padding: 4px 0 10px;
  line-height: 2.2;
  position: relative;
}
#preview span {
  cursor: pointer;
  border-right: 1px solid var(--rule-soft);
  margin-right: 4px;
  padding-right: 4px;
}
#preview span:hover { background: var(--mark); }
#preview span.now { color: var(--accent); text-decoration: underline 2px var(--accent); text-underline-offset: 5px; }
#preview br + br { display: none; }

/* 書棚: 目次のように、題名から状態まで点線でつなぐ */
#shelf { list-style: none; margin: 0; padding: 0; }
.book { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 7px 0 7px 14px; border-bottom: 1px solid var(--rule-soft); }
.book.current::before { content: ""; position: absolute; left: 0; top: 0; bottom: -1px; width: 3px; background: var(--accent); }   /* 栞紐 */
.book .open { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; border: 0; padding: 0; letter-spacing: 0; text-align: left; background: transparent; box-shadow: none; font-weight: inherit; color: inherit; }
.book .open:active { transform: none; }
.book .open:hover { background: none; }
.book .open:hover .title { color: var(--accent); }
.book .title { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; white-space: nowrap; }
.book .author { color: var(--muted); font-size: 13px; white-space: nowrap; }
.book .leader { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--muted); transform: translateY(-5px); }
.book .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.book .state { min-width: 3.5em; text-align: right; white-space: nowrap; }
.book.current .state { color: var(--accent); }
.book .del { font-size: 12px; padding: 0 8px; letter-spacing: .1em; border-color: var(--rule-soft); color: var(--muted); }
.book .del.confirm { border-color: var(--accent); color: var(--accent); }
@media (max-width: 520px) { .book .meta { display: none; } }
.addform { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 14px 0; }
.addform[hidden] { display: none; }
.addform textarea { min-height: 110px; }
.addform .row { justify-content: flex-start; }
.filebtn { cursor: pointer; }
.filebtn input { font: inherit; font-size: 12.5px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; letter-spacing: .1em; }
details[open] > summary { margin-bottom: 8px; }
textarea[readonly] { color: var(--muted); }
#textNote a { color: var(--accent); }

/* ================= テーマ =================
   既定（上の指定）は「紙と活字」。以下は <html data-skin="…"> で上書きする。
   計器・ドパ・夜は一つの世界観で描くため、ライト／ダークの切り替えを持たない。 */

/* ---- 標準: 最初の見た目（青灰の地に白いカード） ---- */
:root[data-skin="classic"] {
  color-scheme: light;
  --bg: #eef1f5; --surface: #ffffff; --ink: #1b2330; --muted: #5d6878;
  --rule: #d3d9e2; --rule-soft: #e8ecf1; --field: #dfe4eb;
  --accent: #2c4a9a; --accent-ink: #ffffff; --mark: #dfe7fb;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="classic"]:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12161d; --surface: #1b212b; --ink: #e8ecf2; --muted: #98a3b3;
    --rule: #313a48; --rule-soft: #252c37; --field: #0b0e13;
    --accent: #8fb0ff; --accent-ink: #10192c; --mark: #2a3a63;
  }
}
:root[data-skin="classic"][data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161d; --surface: #1b212b; --ink: #e8ecf2; --muted: #98a3b3;
  --rule: #313a48; --rule-soft: #252c37; --field: #0b0e13;
  --accent: #8fb0ff; --accent-ink: #10192c; --mark: #2a3a63;
}
[data-skin="classic"] body { font-size: 15px; line-height: 1.7; }
[data-skin="classic"] main { gap: 16px; padding-top: 20px; }
[data-skin="classic"] header { border-bottom: 0; padding-bottom: 0; }
[data-skin="classic"] h1 { font-family: var(--font-body); font-size: 18px; letter-spacing: .04em; }
[data-skin="classic"] h2 { font-family: var(--font-body); font-size: 13px; color: var(--muted); letter-spacing: .08em; }
[data-skin="classic"] .stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; height: 200px; }
[data-skin="classic"] .stage::before, [data-skin="classic"] .stage::after { width: 2px; height: 22px; margin-left: -1px; }
[data-skin="classic"] input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--rule); }
[data-skin="classic"] input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rule); }
[data-skin="classic"] input[type="range"]::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--accent); }
[data-skin="classic"] input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
[data-skin="classic"] .stats { letter-spacing: 0; font-size: 12.5px; }
[data-skin="classic"] .controls { border-bottom: 0; padding-bottom: 0; }
[data-skin="classic"] button { background: var(--surface); border-color: var(--rule); border-radius: 8px; padding: 7px 14px; letter-spacing: 0; font-weight: 500; }
[data-skin="classic"] button:hover { background: var(--surface); border-color: var(--accent); }
[data-skin="classic"] button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
[data-skin="classic"] input[type="checkbox"] { accent-color: var(--accent); }
[data-skin="classic"] .grid { gap: 16px; }
[data-skin="classic"] .grid > .panel { padding: 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); margin: 0; }
[data-skin="classic"] .panel h2 { border-bottom: 0; padding-bottom: 0; }
[data-skin="classic"] .seg { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(auto-fit, minmax(48px, 1fr)); }
[data-skin="classic"] .seg label { text-align: center; padding: 6px 4px; border-left: 1px solid var(--rule); color: var(--ink); font-size: 14px; }
[data-skin="classic"] .seg label:first-of-type { padding-left: 4px; border-left: 0; }
[data-skin="classic"] .seg input:checked + label { background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; }
[data-skin="classic"] input[type="text"] { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; background: var(--bg); }
[data-skin="classic"] textarea { border: 1px solid var(--rule); border-radius: 8px; line-height: 1.7; }
[data-skin="classic"] #preview { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 10px 12px; line-height: 2.1; }
[data-skin="classic"] #preview span.now { background: var(--accent); color: var(--accent-ink); text-decoration: none; border-radius: 3px; }
[data-skin="classic"] #shelf { display: flex; flex-direction: column; gap: 6px; }
[data-skin="classic"] .book { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 8px 10px; }
[data-skin="classic"] .book.current { border-color: var(--accent); background: var(--mark); }
[data-skin="classic"] .book.current::before { display: none; }
[data-skin="classic"] .book .title { font-family: var(--font-body); font-size: 15px; }
[data-skin="classic"] .book .leader { border-bottom-color: transparent; }
[data-skin="classic"] .addform { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; }

/* ---- 計器: 瞬間露出器。灰色の筐体、黒い表示窓、目盛り、黄色の差し色 ---- */
:root[data-skin="tachisto"] {
  color-scheme: light;
  --bg: #d6d5cf; --surface: #e3e2dd; --ink: #1c1c1b; --muted: #55554f;
  --rule: #1c1c1b; --rule-soft: #b3b2ab; --field: #c9c8c1;
  --accent: #f0b400; --accent-ink: #1c1c1b; --mark: #ecd78a;
  --stage-bg: #121211; --stage-ink: #f1eee2;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
[data-skin="tachisto"] body { font-size: 14.5px; line-height: 1.7; }
[data-skin="tachisto"] header { border-bottom: 2px solid var(--rule); }
[data-skin="tachisto"] h1 { font-family: var(--font-mono); font-size: 20px; font-weight: 500; letter-spacing: .35em; text-transform: uppercase; }
[data-skin="tachisto"] header p { font-size: 12.5px; }
[data-skin="tachisto"] h2 { font-family: var(--font-mono); font-size: 12px; letter-spacing: .25em; }
[data-skin="tachisto"] .panel h2 { flex: none; border: 0; padding: 1px 10px; background: var(--ink); color: var(--accent); align-self: flex-start; }
[data-skin="tachisto"] .stage { border: 10px solid #2b2b29; border-radius: 6px; box-shadow: inset 0 0 0 1px #000, 0 2px 0 #9a9992; height: 230px; }
[data-skin="tachisto"] #chunk { font-weight: 500; }
[data-skin="tachisto"] .stage::before, [data-skin="tachisto"] .stage::after { width: 2px; margin-left: -1px; }
[data-skin="tachisto"] input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(var(--rule), var(--rule)) bottom / 100% 1px no-repeat, repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 10%); }
[data-skin="tachisto"] input[type="range"]::-moz-range-track { height: 8px; background: linear-gradient(var(--rule), var(--rule)) bottom / 100% 1px no-repeat, repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 10%); }
[data-skin="tachisto"] input[type="range"]::-webkit-slider-thumb { width: 12px; height: 20px; margin-top: -8px; background: var(--accent); border: 2px solid var(--ink); }
[data-skin="tachisto"] input[type="range"]::-moz-range-thumb { width: 8px; height: 16px; background: var(--accent); border: 2px solid var(--ink); }
[data-skin="tachisto"] .stats, [data-skin="tachisto"] .field output, [data-skin="tachisto"] .book .meta, [data-skin="tachisto"] .book .state { font-family: var(--font-mono); letter-spacing: .05em; }
[data-skin="tachisto"] .field output { color: var(--ink); background: var(--accent); padding: 0 6px; }
[data-skin="tachisto"] .controls { border-bottom: 2px solid var(--rule-soft); }
[data-skin="tachisto"] button { background: #ebeae5; border: 2px solid var(--ink); border-radius: 3px; box-shadow: 0 2px 0 var(--ink); padding: 3px 14px; letter-spacing: .1em; font-weight: 500; }
[data-skin="tachisto"] button:hover { background: #f4f3ee; }
[data-skin="tachisto"] button:active { transform: translateY(2px); box-shadow: none; }
[data-skin="tachisto"] button.primary { background: var(--accent); color: var(--ink); }
[data-skin="tachisto"] button.primary:hover { background: #ffc81a; color: var(--ink); border-color: var(--ink); }
[data-skin="tachisto"] .grid { gap: 16px; }
[data-skin="tachisto"] .grid > .panel { padding: 16px; border: 2px solid var(--ink); border-radius: 4px; background: var(--surface); margin: 0; }
[data-skin="tachisto"] .seg input:checked + label { text-decoration: none; background: var(--ink); color: var(--accent); }
[data-skin="tachisto"] .seg label { padding: 0 10px; border-left: 2px solid var(--rule-soft); color: var(--ink); }
[data-skin="tachisto"] .seg label:first-of-type { padding-left: 10px; }
[data-skin="tachisto"] textarea { background: var(--field); border: 2px solid var(--ink); border-radius: 3px; }
[data-skin="tachisto"] #preview span.now { color: var(--ink); background: var(--accent); text-decoration: none; }
[data-skin="tachisto"] .book.current::before { background: var(--accent); width: 6px; }
[data-skin="tachisto"] .book .title { font-family: var(--font-body); font-size: 15px; }

/* ---- ドパ: 濃い紫の地に蛍光ピンクと水色、太いゴシック、ずらした影 ---- */
:root[data-skin="dopa"] {
  color-scheme: dark;
  --bg: #14061f; --surface: #1f0c30; --ink: #fbf6ff; --muted: #b9a0d2;

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

[data-skin="dopa"] body { font-size: 15px; line-height: 1.7; font-weight: 500; }
[data-skin="dopa"] header { border-bottom: 4px solid var(--accent2); }
[data-skin="dopa"] h1 { font-size: 36px; letter-spacing: .02em; color: var(--accent); text-shadow: 3px 3px 0 var(--accent2); font-weight: 400; }
[data-skin="dopa"] h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: .1em; font-size: 15px; }
[data-skin="dopa"] .panel h2 { flex: none; align-self: flex-start; border: 0; padding: 0 10px; background: var(--accent2); color: var(--bg); }
[data-skin="dopa"] .stage { border: 4px solid var(--accent); box-shadow: 8px 8px 0 var(--accent2); height: 230px; margin-right: 8px; }
[data-skin="dopa"] #chunk { font-weight: 400; }
[data-skin="dopa"] .stage::before, [data-skin="dopa"] .stage::after { width: 4px; margin-left: -2px; background: var(--accent2); }
[data-skin="dopa"] input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: var(--rule-soft); }
[data-skin="dopa"] input[type="range"]::-moz-range-track { height: 6px; background: var(--rule-soft); }
[data-skin="dopa"] input[type="range"]::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6px; background: var(--accent2); }
[data-skin="dopa"] input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: var(--accent2); }
[data-skin="dopa"] #seek::-webkit-slider-thumb { background: var(--accent); }
[data-skin="dopa"] #seek::-moz-range-thumb { background: var(--accent); }
[data-skin="dopa"] .stats { color: var(--accent2); letter-spacing: .05em; font-weight: 700; }
[data-skin="dopa"] .controls { border-bottom: 2px solid var(--rule-soft); }
[data-skin="dopa"] button { border: 3px solid var(--ink); font-weight: 700; letter-spacing: .08em; padding: 3px 16px; }
[data-skin="dopa"] button:hover { background: var(--mark); }
[data-skin="dopa"] button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 4px 4px 0 var(--accent2); }
[data-skin="dopa"] button.primary:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--accent2); background: var(--accent); color: var(--bg); }
[data-skin="dopa"] input[type="checkbox"] { accent-color: var(--accent); }
[data-skin="dopa"] .grid > .panel:first-child { border-right: 3px solid var(--rule-soft); }
[data-skin="dopa"] .seg label { color: var(--muted); border-left: 2px solid var(--rule-soft); }
[data-skin="dopa"] .seg input:checked + label { text-decoration: none; background: var(--accent); color: var(--bg); }
[data-skin="dopa"] .seg label { padding: 0 10px; }
[data-skin="dopa"] .seg label:first-of-type { padding-left: 10px; }
[data-skin="dopa"] .field output { color: var(--accent2); font-weight: 700; }
[data-skin="dopa"] textarea { border: 2px solid var(--rule-soft); }
[data-skin="dopa"] #preview span.now { background: var(--accent); color: var(--bg); text-decoration: none; }
[data-skin="dopa"] .book .title { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
[data-skin="dopa"] .book .leader { border-bottom: 2px dotted var(--rule-soft); }
[data-skin="dopa"] .book.current::before { width: 6px; background: var(--accent2); }
[data-skin="dopa"] .book.current .state, [data-skin="dopa"] .book .open:hover .title { color: var(--accent2); }

/* ---- 夜読み: ほぼ黒の地に文字だけが浮かぶ。操作部品は小さく控えめ ---- */
:root[data-skin="night"] {
  color-scheme: dark;
  --bg: #0c0c0d; --ink: #b4b0a7; --muted: #66645f;
  --rule: #2c2c2e; --rule-soft: #1c1c1e; --field: #141416;
  --accent: #b38848; --accent-ink: #0c0c0d; --mark: #1b1915;
  --stage-ink: #e2ddd2;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
[data-skin="night"] body { font-size: 13.5px; line-height: 1.75; }
[data-skin="night"] main { gap: 18px; }
[data-skin="night"] header { border-bottom: 1px solid var(--rule); }
[data-skin="night"] h1 { font-family: var(--font-body); font-size: 14px; font-weight: 400; letter-spacing: .4em; color: var(--muted); }
[data-skin="night"] header p { font-size: 12px; }
[data-skin="night"] h2 { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .3em; }
[data-skin="night"] .panel h2 { border-bottom-color: var(--rule); }
[data-skin="night"] .stage { border: 0; height: 340px; }
[data-skin="night"] #chunk { font-weight: 400; }
[data-skin="night"] .stage::before, [data-skin="night"] .stage::after { height: 12px; opacity: .6; }
[data-skin="night"] .stage::before { top: calc(50% - 70px); }
[data-skin="night"] .stage::after { bottom: calc(50% - 70px); }
[data-skin="night"] input[type="range"]::-webkit-slider-runnable-track { background: var(--rule); }
[data-skin="night"] input[type="range"]::-moz-range-track { background: var(--rule); }
[data-skin="night"] input[type="range"]::-webkit-slider-thumb { width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--muted); }
[data-skin="night"] input[type="range"]::-moz-range-thumb { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
[data-skin="night"] #seek::-webkit-slider-thumb { background: var(--accent); }
[data-skin="night"] #seek::-moz-range-thumb { background: var(--accent); }
[data-skin="night"] .stats { font-size: 12px; }
[data-skin="night"] .controls { border-bottom-color: var(--rule); font-size: 13px; }
[data-skin="night"] button { border: 0; padding: 2px 6px; color: var(--muted); letter-spacing: .15em; }
[data-skin="night"] button:hover { background: none; color: var(--ink); }
[data-skin="night"] button.primary { background: none; color: var(--accent); min-width: 0; }
[data-skin="night"] button.primary:hover { background: none; color: var(--stage-ink); border: 0; }
[data-skin="night"] .del { border: 0; }
[data-skin="night"] input[type="checkbox"] { accent-color: var(--accent); opacity: .8; }
[data-skin="night"] .grid > .panel:first-child { border-right-color: var(--rule); }
[data-skin="night"] .seg label { border-left-color: var(--rule); }
[data-skin="night"] .seg input:checked + label { text-decoration-thickness: 1px; }
[data-skin="night"] .book { border-bottom-color: var(--rule-soft); }
[data-skin="night"] .book .title { font-family: var(--font-body); font-weight: 400; font-size: 14px; }
[data-skin="night"] .book .leader { border-bottom-color: var(--rule); }
[data-skin="night"] .book.current::before { width: 1px; }
[data-skin="night"] .addform { border-color: var(--rule); }
[data-skin="night"] kbd { border-color: var(--rule); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dopayomi</h1>
    <p>日本語のRSVPリーダー。視線を中央の印に置いたまま、区切りごとに流れる文を読みます。</p>
  </header>

  <div class="stage" id="stage" role="button" aria-label="クリックで再生／一時停止"><div id="chunk" aria-live="off"><span class="lead kana"></span><span class="core"></span><span class="trail kana"></span></div></div>

  <div class="bar">
    <input type="range" id="seek" min="0" max="0" value="0" aria-label="読む位置">
    <div class="stats"><span id="pos"></span><span id="remain"></span></div>
  </div>

  <div class="controls">
    <button class="primary" id="play" type="button">再生</button>
    <button id="restart" type="button">最初から</button>
    <span class="onplay">再生時に</span>
    <span class="check"><input type="checkbox" id="immersive"><label for="immersive">UI消去</label></span>
    <span class="check"><input type="checkbox" id="autofull"><label for="autofull">全画面化</label></span>
    <span class="hint" id="fullNote" hidden></span>
    <span class="keys"><kbd>Space</kbd> 再生／停止　<kbd>←</kbd><kbd>→</kbd> 前後　<kbd>↑</kbd><kbd>↓</kbd> 速度</span>
  </div>

  <div class="grid">
    <section class="panel" aria-labelledby="h-set">
      <h2 id="h-set">設定</h2>

      <div class="field">
        <span class="label">見た目</span>
        <div class="seg" role="radiogroup" aria-label="見た目">
          <input type="radio" name="skin" id="k-classic" value="classic"><label for="k-classic">標準</label>
          <input type="radio" name="skin" id="k-tachisto" value="tachisto"><label for="k-tachisto">計器</label>
          <input type="radio" name="skin" id="k-dopa" value="dopa"><label for="k-dopa">ドパ</label>
          <input type="radio" name="skin" id="k-paper" value="paper" checked><label for="k-paper">紙</label>
          <input type="radio" name="skin" id="k-night" value="night"><label for="k-night">夜</label>
        </div>
      </div>

      <div class="field">
        <span class="label">区切り方</span>
        <div class="seg" role="radiogroup" aria-label="区切り方">
          <input type="radio" name="mode" id="m-bunsetsu" value="bunsetsu" checked><label for="m-bunsetsu">文節</label>
          <input type="radio" name="mode" id="m-pos" value="pos"><label for="m-pos">品詞</label>
          <input type="radio" name="mode" id="m-word" value="word"><label for="m-word">単語</label>
          <input type="radio" name="mode" id="m-fixed" value="fixed"><label for="m-fixed">字数</label>
        </div>
        <p class="hint" id="modeHint"></p>
      </div>

      <div class="field">
        <label for="cpm">速度 <output id="cpmOut"></output></label>
        <input type="range" id="cpm" min="300" max="2400" step="50" value="900">
        <p class="hint">標準は毎分900字です。</p>
      </div>

      <div class="field">
        <label for="maxLen"><span id="maxLenLabel">1区切りの上限</span> <output id="maxLenOut"></output></label>
        <input type="range" id="maxLen" min="3" max="16" step="1" value="5">
        <p class="hint" id="maxLenHint"></p>
      </div>

      <div class="field">
        <label for="pause">句読点での間 <output id="pauseOut"></output></label>
        <input type="range" id="pause" min="0" max="3" step="0.2" value="1.2">
      </div>

      <div class="field">
        <label for="terms">ひとまとめにする語</label>
        <input type="text" id="terms" placeholder="例: いるかホテル、羊男" autocomplete="off">
        <div class="check"><input type="checkbox" id="auto"><label for="auto">繰り返し出る並びを自動でまとめる</label></div>
        <p class="hint" id="detected"></p>
      </div>

      <div class="check"><input type="checkbox" id="merge"><label for="merge">文節をつなげて目安の長さに寄せる</label></div>
      <div class="field">
        <label for="fsKanji">漢字の大きさ <output id="fsKanjiOut"></output></label>
        <input type="range" id="fsKanji" min="50" max="150" step="5" value="70">
      </div>
      <div class="field">
        <label for="fsKana">かな・句読点の大きさ <output id="fsKanaOut"></output></label>
        <input type="range" id="fsKana" min="50" max="150" step="5" value="65">
      </div>
      <div class="check"><input type="checkbox" id="gothic"><label for="gothic">ゴシック体で表示する</label></div>
      <div class="row">
        <button id="copySettings" type="button">設定をコピー</button>
        <span class="hint" id="copyNote"></span>
      </div>
      <textarea id="settingsOut" readonly hidden aria-label="設定の文字列" style="min-height: 90px; font-size: 12px;"></textarea>
    </section>

    <section class="panel" aria-labelledby="h-text">
      <div class="row">
        <h2 id="h-text">書棚</h2>
        <button id="addBook" type="button">本を追加</button>
      </div>
      <form class="addform" id="addForm" hidden>
        <input type="text" id="newTitle" placeholder="題名" autocomplete="off" aria-label="題名">
        <input type="text" id="newAuthor" placeholder="著者（なくても可）" autocomplete="off" aria-label="著者">
        <textarea id="newText" spellcheck="false" placeholder="本文を貼り付けるか、下からテキストファイルを読み込みます" aria-label="追加する本文"></textarea>
        <label class="filebtn hint">テキストファイル（.txt）を読み込む: <input type="file" id="newFile" accept=".txt,text/plain"></label>
        <p class="hint">Shift_JIS のファイルも読めます。青空文庫のルビ・注記・底本情報は自動で取り除きます。</p>
        <div class="row">
          <button class="primary" type="submit" id="addSave">書棚に追加</button>
          <button type="button" id="addCancel">やめる</button>
          <span class="hint" id="addNote"></span>
        </div>
      </form>
      <ul id="shelf" aria-label="書棚の本"></ul>
      <p class="hint" id="shelfNote"></p>
      <details id="textBox">
        <summary>本文を表示</summary>
        <textarea id="text" spellcheck="false" aria-label="読んでいる本の本文"></textarea>
        <p class="hint" id="textNote"></p>
      </details>
      <div class="row">
        <h2>区切りの確認</h2>
        <span class="check"><input type="checkbox" id="follow"><label for="follow">読んでいる位置に合わせてスクロール</label></span>
      </div>
      <div id="preview"></div>
      <p class="hint">クリックした位置から読めます。</p>
    </section>
  </div>
</main>

<script src="budoux-ja.js"></script>

<script id="seglib">
/* ---- 区切りのロジック（DOMに依存しない） ---- */
var RE_HIRA = /^[ぁ-ゖゝゞー]+$/;
var RE_STOP = /^[、。，．！？!?…‥,.;；]+$/;          // ここで区切りを閉じる
var RE_CLOSE = /^[」』）)\]】〉》”’:：・〜～ー―—\-]+$/;   // 前に付けるが閉じない
var RE_OPEN = /^[「『（(\[【〈《“‘]+$/;                 // 次の区切りの頭に付ける
var RE_KANJI_END = /[一-鿿々〆ヶァ-ヺ]$/;
var RE_KANJI1 = /^[一-鿿]$/;
var RE_DIGIT_END = /[0-9０-９]$/;
var RE_HAS_HIRA = /[ぁ-ゖ]/;
// ひらがなだけでも新しい文節を始める語（自立語）
var INDEP = new Set(('この その あの どの これ それ あれ どれ ここ そこ あそこ どこ こう そう ああ どう ' +
  'そして しかし また ただ もし なぜ だから つまり さらに そこで それで ところが けれども すると なお および または あるいは ' +
  'とても かなり すぐ まだ もう ずっと きっと やはり やっぱり ほとんど たくさん すこし ちょっと もっと いつも よく たとえば もちろん むしろ ' +
  'こと もの ため とき ところ ひと わたし あなた みんな だれ なに いつ いま ' +
  'ある ない いい よい できる わかる なる').split(' '));

function tokenize(text) {
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    var seg = new Intl.Segmenter('ja', { granularity: 'word' });
    var out = [];
    for (var s of seg.segment(text)) out.push(s.segment);
    return out;
  }
  // Intl.Segmenter がない環境: 文字種の変わり目で分ける簡易版
  return text.match(/[一-鿿々〆ヶ]+|[ぁ-ゖー]+|[ァ-ヺー]+|[A-Za-z0-9０-９]+|\s+|[\s\S]/g) || [];
}

function plainLen(s) { return s.replace(/[、。，．！？!?…‥,.;；「」『』（）()\[\]【】〈〉《》“”‘’:：・\s]/g, '').length; }

// ---- 文節モード: BudouX の文節境界を土台に、つなぎ直しと長すぎる文節の分割をする ----
var RENTAI = new Set('この その あの どの 同じ 大きな 小さな ある いわゆる あらゆる わが'.split(' '));
var RE_PARTICLE_END = /[はがをにへとでもやの]$/;
var RE_COMPOUND = /^(よって|より|よる|よれば|よると|ついて|つき|おいて|おける|とって|対して|対する|関して|関する|つれて|わたって|かけて|応じて|基づいて|比べて)/;
var RE_AUX = /^(いる|いた|いて|います|いました|いく|いった|くる|きた|みる|みた|おく|おいた|しまう|しまった|ください|ほしい|もらう|もらった|くれる|くれた|あげる)/;
var RE_END_PUNCT = /[、。，．！？!?…‥」』）)]$/;
var RE_OPEN_TAIL = /[「『（(\[【〈《“‘]+$/;
function plain(s) { return s.replace(/[、。，．！？!?…‥,.;；「」『』（）()\[\]【】〈〉《》“”‘’:：・\s]/g, ''); }

var RE_STEM = /^[\u4e00-\u9fff々]+[\u3041-\u3096]{0,2}[いきぎしじちびみりえけげせぜねべめれ]$/;   // 泊まり、買い、読み、受け など
var RE_FORMAL = /^(こと|もの|ため|よう|はず|わけ|ところ|とき|ほう|まま|つもり)/;           // 形式名詞
var RE_LIGHT = /^(でき|なる|なっ|なり|する|した|して|しま|ある|あっ|あり|ない|なかっ|いる|いた|いま)/; // 軽い述語

// 読むときの重さ（漢字1、かな0.8、英数0.5）。句読点・括弧は数えない
function weight(s) {
  var w = 0;
  Array.from(plain(s)).forEach(function (c) {
    if (/[\u4e00-\u9fff々〆ヶ]/.test(c)) w += 1;
    else if (/[\u3041-\u30ff]/.test(c)) w += 0.8;
    else if (/[\x20-\x7e]/.test(c)) w += 0.5;
    else w += 1;
  });

}

// 文節 a と b のあいだの切れ目の強さ。0=ほぼ切れない、1=ふつう、2=やや強い、Infinity=必ず切る
function boundary(a, b) {
  var pa = plain(a), pb = plain(b);
  if (/[、。，．！？!?…‥,.;；:：]$/.test(a)) return Infinity;
  if (/[A-Za-z0-9]$/.test(pa) && /^[A-Za-z0-9]/.test(pb)) return Infinity;   // 英単語どうしは詰めない
  if (RE_OPEN.test(b.charAt(0))) return 2;                         // 開き括弧の前
  if (/^[\u30a1-\u30faー・]+$/.test(pa) && /^[\u4e00-\u9fff\u30a1-\u30fa]/.test(pb)) return -1;   // カタカナ語＋漢字は複合語とみなす（モルダウ｜河の）
  if (RE_STEM.test(pa) && /^[\u4e00-\u9fff]/.test(pb)) return -1;   // 連用形＋漢字は複合語とみなす（泊まり｜客の）
  if (RENTAI.has(pa)) return 0;                                    // 連体詞＋名詞（この｜リーダーでは）
  if (/[のな]$/.test(pa)) return 0;                                // 連体修飾（基本の｜単位に、経済的な｜問題）
  if (/に$/.test(pa) && RE_COMPOUND.test(pb)) return 0;            // 複合助詞（人に｜よって）
  if (/と$/.test(pa) && /^(いう|いった|いえば|いって)/.test(pb)) return 0;  // 〜と｜いう
  if (/[てで]$/.test(pa) && RE_AUX.test(pb)) return 0;             // 補助動詞（読んで｜いる）
  if (RE_FORMAL.test(pb)) return 0;                                // 形式名詞（感じる｜ことが）
  if (RE_LIGHT.test(pb)) return 0;                                 // 軽い述語（ことが｜できる）
  if (pa.length <= 2 && !RE_PARTICLE_END.test(pa)) return 0;       // 短い副詞など（まだ｜無い）
  if (/[はも]$/.test(pa)) return 2;                                // 主題のあと
  if (/(ので|から|けど|けれど|ても|たら|なら|れば|[てでば])$/.test(pa)) return 2;  // 節の切れ目
  return 1;

function splitLong(phrase, maxLen, terms) {
  var total = plain(phrase).length;
  var target = total / Math.ceil(total / maxLen);                    // 均等に近い長さで割る
  var pieces = [], cur = '';
  // 割ってよい位置を語の切れ目から選ぶ。ただし複合語の内側（カタカナ語の途中、カタカナ語＋漢字1〜2字、ひとまとめ指定の語）は切らない
  var toks = [];
  protect(tokenize(phrase), terms || []).forEach(function (tok) {

  syncUI();
  renderShelf();
  dbOpen().then(function (d) {
    db = d; dbFailed = !d;
    return dbReq('readonly', function (s) { return s.getAll(); });
  }).then(function (list) {
    (list || []).sort(function (a, b) { return a.added - b.added; }).forEach(function (r) {
      books.push({ id: r.id, title: r.title, author: r.author, kind: 'user', text: r.text, colophon: r.colophon, chars: r.text.replace(/\s/g, '').length, added: r.added });
    });
    if (legacyText) {   // 書棚ができる前の本文を移す
      var b = addBook('前回の本文', '', legacyText);
      if (progress.legacy) { progress[b.id] = progress.legacy; delete progress.legacy; saveProgress(); }
      st.book = b.id; legacyText = null; save();
    }
    return fetch('books/index.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
  }).then(function (list) {
    var aoz = (list || []).map(function (x) { return { id: x.id, title: x.title, author: x.author, kind: 'aozora', chars: x.chars, card: x.card, colophon: x.colophon }; });
    books.splice.apply(books, [1, 0].concat(aoz));   // サンプルの次に青空文庫の本を並べる
    openBook(books.some(function (x) { return x.id === st.book; }) ? st.book : 'sample');
  });
})();
</script>
</body>
</html>
